<!DOCTYPE html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>yum.atfedi.de — おいしい、を分けあう地図</title>
<meta name="description" content="fediverse の誰かが「おいしかった」を置いていく、共有の食マップ。" />
<link rel="icon" href="data:," />
<link rel="stylesheet" href="/style.css" />
<!--
  Naver 지도 키(yum 전용). referer 제한이라 Naver 콘솔의 Web 서비스 URL에
  https://yum.atfedi.de 가 등록되어 있어야 지도가 뜹니다(키 자체는 공개 OK).
-->
<script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=kjrdpxwvrz"></script>

<div class="title-tag">
  yum <small>おいしい、を分けあう地図 — yum.atfedi.de</small>
</div>

<div id="map"></div>

<div class="legend">
  <div class="row"><span class="dot suki"></span>すき</div>
  <div class="row"><span class="dot futsuu"></span>ふつう</div>
  <div class="row"><span class="dot imaichi"></span>いまいち</div>
</div>

<!-- 拡大・縮小。地図が本当に出てから app.js が .ready を付けて、はじめて見える。 -->
<div class="zoom">
  <button type="button" class="zoom-in" aria-label="地図を拡大">＋</button>
  <button type="button" class="zoom-out" aria-label="地図を縮小">−</button>
</div>

<script src="/app.js"></script>
